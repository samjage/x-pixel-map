<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 170" role="img" aria-labelledby="t">
  <title id="t">Service mode: hold the shutter button and Up while switching the camera on</title>
  <style>
    .panel { fill: #1e2228; stroke: #2a2f37; stroke-width: 2; }
    .detail { fill: #171a1f; stroke: #9aa3ad; stroke-width: 1.8; }
    .accent { fill: #4f9cf9; fill-opacity: .18; stroke: #4f9cf9; stroke-width: 2.4; }
    .leader { fill: none; stroke: #4f9cf9; stroke-width: 1.4; stroke-dasharray: 3 3; }
    text { fill: #e8eaed; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; }
    .muted { fill: #9aa3ad; font-size: 9.5px; }
    .lbl { fill: #4f9cf9; font-weight: 650; }
  </style>

  <rect class="panel" x="12" y="18" width="140" height="100" rx="14"/>
  <rect class="panel" x="208" y="18" width="140" height="100" rx="14"/>

  <!-- shutter button -->
  <rect class="accent" x="53" y="48" width="38" height="20" rx="6"/>
  <ellipse cx="72" cy="48" rx="19" ry="6" fill="#4f9cf9" fill-opacity=".18" stroke="#4f9cf9" stroke-width="2.4"/>
  <text x="82" y="94" text-anchor="middle" class="lbl">Shutter</text>

  <!-- selector with Up highlighted -->
  <rect class="detail" x="258" y="30" width="58" height="58" rx="10"/>
  <rect class="accent" x="275" y="34" width="20" height="18" rx="5"/>
  <rect class="detail" x="275" y="68" width="20" height="16" rx="5"/>
  <rect class="detail" x="244" y="50" width="16" height="18" rx="5"/>
  <rect class="detail" x="314" y="50" width="16" height="18" rx="5"/>
  <circle class="detail" cx="285" cy="60" r="12"/>
  <text x="288" y="108" text-anchor="middle" class="lbl">Up</text>

  <text x="180" y="74" text-anchor="middle" style="font-size:24px;fill:#9aa3ad">+</text>
  <text x="180" y="142" text-anchor="middle">Hold both, then switch the camera on</text>
  <text x="180" y="158" text-anchor="middle" class="muted">keep the USB cable connected</text>
</svg>
