<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 190" role="img" aria-labelledby="t">
  <title id="t">X-T1 battery chamber and latch</title>
  <style>
    .body { fill: #1e2228; stroke: #9aa3ad; stroke-width: 2; }
    .detail { fill: none; stroke: #9aa3ad; stroke-width: 1.6; }
    .accent { fill: #4f9cf9; fill-opacity: .14; stroke: #4f9cf9; stroke-width: 2.4; }
    .cable { fill: none; stroke: #4f9cf9; stroke-width: 2.2; }
    text { fill: #e8eaed; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; }
    .muted { fill: #9aa3ad; font-size: 9.5px; }
    .lbl { fill: #4f9cf9; font-weight: 650; }
  </style>

  <rect class="body" x="25" y="18" width="212" height="108" rx="16"/>

  <!-- chamber -->
  <rect class="detail" x="86" y="36" width="122" height="72" rx="9"/>

  <!-- battery -->
  <rect class="accent" x="102" y="50" width="90" height="46" rx="7"/>
  <rect x="116" y="44" width="18" height="6" rx="2" fill="#4f9cf9"/>
  <text x="147" y="78" text-anchor="middle" class="lbl">BATTERY</text>

  <!-- latch -->
  <rect class="accent" x="64" y="70" width="16" height="26" rx="5"/>
  <path class="cable" d="M64 83 H46 M46 83 l6 -4 M46 83 l6 4"/>

  <!-- labels -->
  <text class="lbl" x="8" y="140">Battery latch</text>
  <text class="muted" x="8" y="154">slide, then lift the battery out</text>
  <path d="M64 134 L70 96" fill="none" stroke="#4f9cf9" stroke-width="1.4" stroke-dasharray="3 3"/>
  <circle cx="70" cy="96" r="2.4" fill="#4f9cf9"/>
</svg>
